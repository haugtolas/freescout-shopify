# Push a tag such as v1.0.1 (the number must match VERSION and module.json):
# the zip below is attached to a GitHub release, and FreeScout's
# Manage → Modules page offers it as an update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$v" = "$(tr -d '[:space:]' < VERSION)" || { echo "Tag $v differs from VERSION"; exit 1; }
          grep -q "\"version\": \"$v\"" Shopify/module.json || { echo "Shopify/module.json is not at $v"; exit 1; }

      - name: Build Shopify.zip
        run: |
          zip -r -X Shopify.zip Shopify -x '*.DS_Store' -x '*.bak'
          unzip -l Shopify.zip | head -20

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" Shopify.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
